<!DOCTYPE html>
<!--
  File: trace-app/index.html
  Purpose: Trace viewer for the n8n multi-agent workflow.
    - Left:   list of runs (status, scenario, decision, total duration)
    - Middle: timeline, one row per agent, one bar per executed step
              (x = time since run start, color = status)
    - Right:  detail panel of the clicked step (agent, times, status,
              error, cleaned input/output, LLM model and tokens)
    - Compare: pick a second run to see both on one time axis, plus a
              table of differences (duration, missing steps, errors)
  Data: loads traces/traces.json (written by scripts/export_traces.py).
        Every value shown comes directly from that file.
  No build step, no libraries: plain HTML, CSS and JavaScript.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Trace Viewer</title>
<style>
  /* ---------- Colors (light mode) ---------- */
  :root {
    color-scheme: light;
    --page: #f9f9f7;            /* page background */
    --surface: #fcfcfb;         /* panels and chart background */
    --ink: #0b0b0b;             /* main text */
    --ink-2: #52514e;           /* secondary text */
    --muted: #898781;           /* axis labels */
    --grid: #e1e0d9;            /* gridlines */
    --border: rgba(11,11,11,0.10);
    --good: #0ca30c;            /* status: success */
    --critical: #d03b3b;        /* status: error */
    --warning: #fab219;         /* slow step marker */
    --run-a: #2a78d6;           /* run A in compare mode */
    --run-b: #6250d6;           /* run B in compare mode */
    --select: rgba(42,120,214,0.10);
  }
  /* ---------- Colors (dark mode, own steps) ---------- */
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7;
      --muted: #898781; --grid: #2c2c2a; --border: rgba(255,255,255,0.10);
      --good: #0ca30c; --critical: #d03b3b; --warning: #fab219;
      --run-a: #3987e5; --run-b: #9085e9; --select: rgba(57,135,229,0.18);
    }
  }

  /* ---------- Layout ---------- */
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
         background: var(--page); color: var(--ink); }
  header { display: flex; align-items: baseline; gap: 16px; padding: 14px 20px;
           border-bottom: 1px solid var(--border); }
  header h1 { font-size: 17px; margin: 0; }
  header .meta { color: var(--ink-2); font-size: 13px; }
  header .spacer { flex: 1; }
  .app { display: grid; grid-template-columns: 270px 1fr 340px; height: calc(100vh - 52px); }
  .panel { background: var(--surface); border-right: 1px solid var(--border); overflow: auto; }
  .panel:last-child { border-right: 0; border-left: 1px solid var(--border); }
  .center { overflow: auto; padding: 16px 20px 40px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-2);
       margin: 14px 14px 8px; }

  /* ---------- Run list ---------- */
  .run { display: grid; grid-template-columns: 14px 1fr auto; gap: 2px 8px; align-items: center;
         padding: 8px 14px; cursor: pointer; border-left: 3px solid transparent; }
  .run:hover { background: var(--select); }
  .run.a { border-left-color: var(--run-a); background: var(--select); }
  .run.b { border-left-color: var(--run-b); background: var(--select); }
  .run .name { font-weight: 600; }
  .run .sub { grid-column: 2 / 4; color: var(--ink-2); font-size: 12px; }
  .run .dur { color: var(--ink-2); font-variant-numeric: tabular-nums; font-size: 12px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 8px;
         border: 1px solid var(--border); margin-left: 4px; color: var(--ink-2); }
  .hint { color: var(--ink-2); font-size: 12px; margin: 0 14px 10px; }

  /* ---------- Toolbar and legend ---------- */
  .toolbar { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-bottom: 10px; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; color: var(--ink-2); font-size: 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 14px; height: 10px; border-radius: 2px; display: inline-block; }
  button, select { font: inherit; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border);
                   background: var(--surface); color: var(--ink); cursor: pointer; }

  /* ---------- Timeline ---------- */
  .chart { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 0; }
  svg text { fill: var(--ink-2); font-size: 12px; }
  svg .axis text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  svg .bar { cursor: pointer; }
  svg .bar:hover { opacity: .8; }
  svg .bar.sel { stroke: var(--ink); stroke-width: 2; }

  /* ---------- Analysis cards ---------- */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin: 14px 0; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  .card .q { color: var(--ink-2); font-size: 12px; }
  .card .a { font-weight: 600; margin-top: 2px; }
  .card .s { color: var(--ink-2); font-size: 12px; }

  /* ---------- Tables ---------- */
  table { border-collapse: collapse; width: 100%; font-size: 13px; background: var(--surface);
          border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  td:last-child { white-space: normal; }
  th { color: var(--ink-2); font-weight: 600; font-size: 12px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.click { cursor: pointer; } tr.click:hover { background: var(--select); }
  details summary { cursor: pointer; color: var(--ink-2); margin: 16px 0 8px; }

  /* ---------- Detail panel ---------- */
  .detail { padding: 0 14px 20px; }
  .kv { display: grid; grid-template-columns: 110px 1fr; gap: 4px 8px; font-size: 13px; }
  .kv .k { color: var(--ink-2); }
  .err { color: var(--critical); font-weight: 600; }
  pre { background: var(--page); border: 1px solid var(--border); border-radius: 6px; padding: 8px;
        font-size: 11.5px; overflow: auto; max-height: 260px; white-space: pre-wrap; word-break: break-word; }
  .src { color: var(--muted); font-size: 11px; }

  /* ---------- Tooltip and empty state ---------- */
  #tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--page);
         padding: 6px 9px; border-radius: 6px; font-size: 12px; display: none; z-index: 10; max-width: 320px; }
  .empty { padding: 40px; text-align: center; color: var(--ink-2); }
  .drop { border: 2px dashed var(--border); border-radius: 10px; padding: 30px; margin: 30px auto; max-width: 480px; }
</style>
</head>
<body>
<header>
  <h1>Agent Trace Viewer</h1>
  <span class="meta" id="meta">Crypto Withdrawal Compliance Check · n8n multi-agent workflow</span>
  <span class="spacer"></span>
  <label class="meta"><input type="file" id="file" accept=".json"> load other traces.json</label>
</header>

<div class="app" id="app">
  <!-- Left: run list -->
  <aside class="panel">
    <h2>Runs</h2>
    <p class="hint">Click = select run A. Shift+click (or long-press) = compare with run B.</p>
    <div id="runs"></div>
  </aside>

  <!-- Middle: timeline, analysis, tables -->
  <main class="center" id="center"><div class="empty">Loading traces…</div></main>

  <!-- Right: step details -->
  <aside class="panel">
    <h2>Step details</h2>
    <div class="detail" id="detail"><p class="hint" style="margin:0">Click a bar in the timeline to see the step.</p></div>
  </aside>
</div>
<div id="tip"></div>

<script>
// =====================================================================
// State
// =====================================================================
let DATA = null;          // whole traces.json document
let RUNS = [];            // list of runs
let AGENTS = [];          // fixed row order for the timeline (same for every run)
let MEDIAN = {};          // agent name -> median duration over all runs (for "slow" flags)
let runA = null;          // selected run
let runB = null;          // second run for comparison (or null)
let selStep = null;       // selected step_id

const $ = (id) => document.getElementById(id);                       // short helper
const fmt = (ms) => ms == null ? '–' : ms >= 1000 ? (ms / 1000).toFixed(2) + ' s' : Math.round(ms) + ' ms';  // readable duration
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));  // safe HTML
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();  // read a color variable

// =====================================================================
// Loading the data
// =====================================================================
async function load() {
  // Try the Docker path first, then the repo layout (trace-app/ next to traces/).
  for (const url of ['traces/traces.json', '../traces/traces.json']) {
    try {
      const r = await fetch(url);
      if (r.ok) { init(await r.json()); return; }
    } catch (e) { /* try next path */ }
  }
  // Nothing found (e.g. page opened as a local file): ask for the file.
  $('center').innerHTML = `<div class="drop empty">No <code>traces.json</code> found.<br><br>
    Use “load other traces.json” at the top right, or run<br><code>python3 scripts/export_traces.py</code>.</div>`;
}

$('file').addEventListener('change', async (e) => {    // manual file upload
  const f = e.target.files[0];
  if (f) init(JSON.parse(await f.text()));
});

// =====================================================================
// Preparing the data
// =====================================================================
function init(doc) {
  DATA = doc;
  RUNS = doc.runs || [];
  // Offset of every step from its run start (ms) -> common time base.
  for (const r of RUNS) {
    const t0 = Math.min(...r.steps.filter(s => s.start_time).map(s => Date.parse(s.start_time)));
    for (const s of r.steps) {
      s._t = s.start_time ? Date.parse(s.start_time) - t0 : 0;   // start offset
      s._d = s.duration_ms || 0;                                   // duration
    }
    r._end = Math.max(...r.steps.map(s => s._t + s._d), 0);        // run length on the axis
    // Errors the run recovered from (e.g. LLM rate limit, then a successful retry).
    r._recovered = r.status === 'success' ? r.steps.filter(s => s.status === 'error') : [];
  }
  // Row order: agents sorted by their average position (seq) over all runs.
  const pos = {};
  for (const r of RUNS) for (const s of r.steps) (pos[s.agent] ??= { sum: 0, n: 0, role: s.role }), pos[s.agent].sum += s.seq, pos[s.agent].n++;
  AGENTS = Object.keys(pos).sort((a, b) => pos[a].sum / pos[a].n - pos[b].sum / pos[b].n)
                          .map(name => ({ name, role: pos[name].role }));
  // LLM rows go directly below the agent that calls them first (their predecessor).
  for (const llm of AGENTS.filter(a => a.role === 'llm')) {
    const first = RUNS.flatMap(r => r.steps).find(s => s.agent === llm.name && s.predecessor);
    const parent = first && RUNS.flatMap(r => r.steps).find(s => s.step_id === first.predecessor);
    if (!parent) continue;
    AGENTS.splice(AGENTS.indexOf(llm), 1);                                          // take the row out
    AGENTS.splice(AGENTS.findIndex(a => a.name === parent.agent) + 1, 0, llm);      // put it below its agent
  }
  // Median duration per agent (used to flag slow steps).
  for (const { name } of AGENTS) {
    const ds = RUNS.flatMap(r => r.steps.filter(s => s.agent === name).map(s => s._d)).sort((a, b) => a - b);
    MEDIAN[name] = ds.length ? ds[Math.floor(ds.length / 2)] : 0;
  }
  $('meta').textContent = `${RUNS.length} runs · exported ${doc.generated_at || '?'} · source: ${doc.source || 'n8n'}`;
  // Start selection: from the URL (#a=run_05&b=run_10) or the first run.
  const h = new URLSearchParams(location.hash.slice(1));
  runA = RUNS.find(r => r.run_id === h.get('a')) || RUNS[0] || null;
  runB = RUNS.find(r => r.run_id === h.get('b') && r !== runA) || null;
  selStep = h.get('step') || null;
  renderRuns(); renderCenter(); renderDetail();
}

// A step is "slow" if it took clearly longer than usual for this agent.
function isSlow(s) {
  const m = MEDIAN[s.agent] || 0;
  return s._d > 1000 && s._d > 2 * m && s._d - m > 1000;
}

// =====================================================================
// Left: run list
// =====================================================================
function renderRuns() {
  $('runs').innerHTML = RUNS.map(r => {
    const cls = r === runA ? 'a' : r === runB ? 'b' : '';
    const color = r.status === 'error' ? css('--critical') : css('--good');
    const icon = r.status === 'error' ? '✕' : '✓';
    return `<div class="run ${cls}" data-id="${r.run_id}" title="${esc(r.status)}">
      <span class="dot" style="background:${color}" aria-label="${r.status}"></span>
      <span class="name">${esc(r.run_id)} <span style="color:${color}">${icon}</span>
        ${r === runA ? '<span class="tag">A</span>' : ''}${r === runB ? '<span class="tag">B</span>' : ''}</span>
      <span class="dur">${fmt(r.total_duration_ms)}</span>
      <span class="sub">${esc(r.scenario || '–')} · ${r.status === 'error'
        ? '✕ at ' + esc((r.steps.find(s => s.step_id === r.failed_step) || r.steps.find(s => s.status === 'error') || {}).agent || '?')
        : esc(r.decision || r.status)}${r._recovered.length ? ' · ⚠ retry' : ''}</span>
    </div>`;
  }).join('');
  document.querySelectorAll('.run').forEach(el => {
    const pick = (compare) => {
      const r = RUNS.find(x => x.run_id === el.dataset.id);
      if (compare && runA && r !== runA) runB = (runB === r ? null : r);   // toggle run B
      else { runA = r; if (runB === r) runB = null; }                       // new run A
      selStep = null; renderRuns(); renderCenter(); renderDetail();
    };
    el.addEventListener('click', (e) => pick(e.shiftKey));
    let t; el.addEventListener('touchstart', () => t = setTimeout(() => pick(true), 500), { passive: true });  // long-press on phones
    el.addEventListener('touchend', () => clearTimeout(t));
  });
}

// =====================================================================
// Middle: title, analysis, timeline, tables
// =====================================================================
function renderCenter() {
  if (!runA) { $('center').innerHTML = '<div class="empty">No runs in this file.</div>'; return; }
  const cmp = !!runB;
  $('center').innerHTML = `
    <div class="toolbar">
      <strong>${cmp ? `Compare <span style="color:${css('--run-a')}">A: ${esc(runA.run_id)}</span> vs <span style="color:${css('--run-b')}">B: ${esc(runB.run_id)}</span>`
                     : `Run ${esc(runA.run_id)} · ${esc(runA.scenario || '')}`}</strong>
      ${cmp ? '<button id="clearB">Stop comparing</button>' : '<select id="pickB"><option value="">Compare with…</option>' +
        RUNS.filter(r => r !== runA).map(r => `<option value="${r.run_id}">${r.run_id} · ${esc(r.scenario || '')}</option>`).join('') + '</select>'}
    </div>
    <div class="legend">${legend(cmp)}</div>
    <div class="cards">${cmp ? compareCards() : runCards(runA)}</div>
    <div class="chart" id="chart"></div>
    ${cmp ? compareTable() : stepTable(runA)}
  `;
  if (cmp) $('clearB').onclick = () => { runB = null; renderRuns(); renderCenter(); };
  else $('pickB').onchange = (e) => { runB = RUNS.find(r => r.run_id === e.target.value) || null; renderRuns(); renderCenter(); };
  drawTimeline();
  document.querySelectorAll('tr.click').forEach(tr => tr.onclick = () => selectStep(tr.dataset.step));
}

// Legend: what colors and shapes mean.
function legend(cmp) {
  const items = cmp
    ? [[css('--run-a'), 'Run A'], [css('--run-b'), 'Run B']]
    : [[css('--good'), '✓ success'], [css('--critical'), '✕ error']];
  return items.map(([c, l]) => `<span><i class="sw" style="background:${c}"></i>${l}</span>`).join('') +
    (cmp ? `<span><i class="sw" style="border:2px solid ${css('--critical')}"></i>✕ error step</span>` : '') +
    `<span><i class="sw" style="border:2px solid ${css('--warning')}"></i>⚠ slow (more than 2× the usual time)</span>
     <span>◆ router (IF decision)</span><span>▨ LLM call (inside its agent)</span>
     <span>x = time since run start</span>`;
}

// Analysis cards for one run: answers "where did it fail?" and "what slowed it down?".
function runCards(r) {
  const err = r.status === 'error' ? (r.steps.find(s => s.step_id === r.failed_step) || r.steps.find(s => s.status === 'error')) : null;
  const rec = r._recovered[0];                                   // first recovered error, if any
  const agents = r.steps.filter(s => s.role === 'agent');
  const slowest = agents.slice().sort((a, b) => b._d - a._d)[0];
  const share = slowest && r._end ? Math.round(100 * slowest._d / r._end) : 0;
  return `
    <div class="card"><div class="q">Where did the error occur?</div>
      <div class="a" style="color:${err ? css('--critical') : css('--good')}">${err ? '✕ ' + esc(err.agent) : '✓ No error'}</div>
      <div class="s">${err ? esc(err.error_message) : rec ? `⚠ ${r._recovered.length} recovered error(s) at ${esc(rec.agent)}: ${esc(rec.error_message)} — the retry succeeded.` : 'All executed steps succeeded.'}</div></div>
    <div class="card"><div class="q">Which step delayed the run?</div>
      <div class="a">${slowest ? esc(slowest.agent) : '–'}</div>
      <div class="s">${slowest ? `${fmt(slowest._d)} = ${share}% of the run · usual ${fmt(MEDIAN[slowest.agent])}${isSlow(slowest) ? ' · ⚠ slower than usual' : ''}` : ''}</div></div>
    <div class="card"><div class="q">Outcome</div>
      <div class="a">${esc(r.status === 'error' ? 'stopped with error' : (r.decision || r.status))}</div>
      <div class="s">${r.steps.length} steps · ${fmt(r.total_duration_ms)} total · ${r.steps.filter(s => s.role === 'llm').length} LLM call(s)</div></div>`;
}

// Analysis cards for two runs.
function compareCards() {
  const d = (runB.total_duration_ms || 0) - (runA.total_duration_ms || 0);
  const rows = diffRows();
  const div = rows.find(x => !x.a || !x.b || x.a.status !== x.b.status);   // first step where the paths differ
  const big = rows.filter(x => x.a && x.b).sort((p, q) => Math.abs(q.b._d - q.a._d) - Math.abs(p.b._d - p.a._d))[0];
  const fail = (r) => r.status === 'error' ? (r.steps.find(s => s.step_id === r.failed_step) || r.steps.find(s => s.status === 'error')) : null;
  const errA = fail(runA), errB = fail(runB);
  return `
    <div class="card"><div class="q">Total duration (B − A)</div>
      <div class="a">${d >= 0 ? '+' : '−'}${fmt(Math.abs(d))}</div>
      <div class="s">A ${fmt(runA.total_duration_ms)} · B ${fmt(runB.total_duration_ms)}</div></div>
    <div class="card"><div class="q">Where do the runs diverge?</div>
      <div class="a">${div ? esc(div.agent) : 'Same path'}</div>
      <div class="s">${div ? (!div.a ? 'only in B' : !div.b ? 'only in A' : `status A ${div.a.status} / B ${div.b.status}`) : 'Both runs executed the same steps.'}</div></div>
    <div class="card"><div class="q">Largest time difference</div>
      <div class="a">${big ? esc(big.agent) : '–'}</div>
      <div class="s">${big ? `A ${fmt(big.a._d)} · B ${fmt(big.b._d)}` : ''}</div></div>
    <div class="card"><div class="q">Errors</div>
      <div class="a">${errA || errB ? '✕' : '✓ none'}</div>
      <div class="s">A: ${errA ? esc(errA.agent) : 'no error'} · B: ${errB ? esc(errB.agent) : 'no error'}</div></div>`;
}

// One row per agent with the step of run A and run B (first execution of that agent).
function diffRows() {
  return AGENTS.map(({ name, role }) => ({
    agent: name, role,
    a: runA.steps.find(s => s.agent === name),
    b: runB.steps.find(s => s.agent === name),
  })).filter(x => x.a || x.b);
}

// =====================================================================
// Timeline (SVG)
// =====================================================================
function drawTimeline() {
  const cmp = !!runB;
  const runs = cmp ? [runA, runB] : [runA];
  // Only agents that appear in the shown run(s); keeps the chart compact.
  const rows = AGENTS.filter(a => runs.some(r => r.steps.some(s => s.agent === a.name)));
  const W = Math.max($('chart').clientWidth, 520), L = 210, R = 80, TOP = 26;  // R leaves room for labels after the last bar
  const laneH = cmp ? 13 : 18, rowH = cmp ? 34 : 28;
  const H = TOP + rows.length * rowH + 10;
  const tMax = Math.max(...runs.map(r => r._end), 1);                 // same time axis for both runs
  const x = (t) => L + (W - L - R) * t / tMax;

  // Nice tick step for the time axis.
  const raw = tMax / 6, mag = 10 ** Math.floor(Math.log10(raw)), step = [1, 2, 5, 10].map(m => m * mag).find(s => s >= raw);
  let svg = `<svg width="${W}" height="${H}" role="img" aria-label="Timeline of ${runs.map(r => r.run_id).join(' and ')}">
    <defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="rgba(255,255,255,.55)" stroke-width="2"/></pattern></defs><g class="axis">`;
  for (let t = 0; t <= tMax + 1; t += step) {
    svg += `<line x1="${x(t)}" x2="${x(t)}" y1="${TOP - 6}" y2="${H - 6}" stroke="${css('--grid')}" stroke-width="1"/>
            <text x="${x(t)}" y="${TOP - 10}" text-anchor="middle">${fmt(t)}</text>`;
  }
  svg += `</g>`;

  rows.forEach((a, i) => {
    const y0 = TOP + i * rowH;
    // Row label (LLM rows indented to show they belong to an agent).
    const label = a.role === 'llm' ? '↳ ' + a.name + ' (LLM)' : a.name;
    svg += `<text x="${L - 10}" y="${y0 + rowH / 2 + 4}" text-anchor="end" style="font-weight:${a.role === 'agent' ? 600 : 400}">${esc(label)}</text>
            <line x1="${L}" x2="${W - R}" y1="${y0 + rowH}" y2="${y0 + rowH}" stroke="${css('--grid')}" stroke-width="1"/>`;
    runs.forEach((r, k) => {
      const yy = cmp ? y0 + 3 + k * (laneH + 2) : y0 + (rowH - laneH) / 2;
      for (const s of r.steps.filter(s => s.agent === a.name)) {
        const isErr = s.status === 'error';
        const fill = cmp ? (k === 0 ? css('--run-a') : css('--run-b')) : (isErr ? css('--critical') : css('--good'));
        const sel = s.step_id === selStep ? ' sel' : '';
        const tipText = `${r.run_id} · ${s.agent}|${fmt(s._d)} · ${s.status}${s.error_message ? ' · ' + s.error_message : ''}${isSlow(s) ? ' · slow' : ''}`;
        if (a.role === 'router' || a.role === 'trigger') {
          // Routers and trigger take ~0 ms: draw a diamond instead of a bar.
          const cx = x(s._t), cy = yy + laneH / 2, d = laneH / 2;
          svg += `<path class="bar${sel}" data-step="${s.step_id}" data-tip="${esc(tipText)}"
                    d="M${cx} ${cy - d}L${cx + d} ${cy}L${cx} ${cy + d}L${cx - d} ${cy}Z" fill="${fill}"/>`;
        } else {
          const bw = Math.max(x(s._t + s._d) - x(s._t), 3);
          svg += `<rect class="bar${sel}" data-step="${s.step_id}" data-tip="${esc(tipText)}" x="${x(s._t)}" y="${yy}"
                    width="${bw}" height="${laneH}" rx="3" fill="${fill}"/>`;
          if (a.role === 'llm') svg += `<rect x="${x(s._t)}" y="${yy}" width="${bw}" height="${laneH}" rx="3" fill="url(#hatch)" pointer-events="none"/>`;
          if (isSlow(s)) svg += `<rect x="${x(s._t) - 2}" y="${yy - 2}" width="${bw + 4}" height="${laneH + 4}" rx="4" fill="none"
                                   stroke="${css('--warning')}" stroke-width="2" pointer-events="none"/>
                                 <text x="${x(s._t) + bw + 6}" y="${yy + laneH - 2}" style="fill:${css('--ink-2')}">⚠ ${fmt(s._d)}</text>`;
          if (cmp && isErr) svg += `<rect x="${x(s._t)}" y="${yy}" width="${bw}" height="${laneH}" rx="3" fill="none"
                                      stroke="${css('--critical')}" stroke-width="2.5" pointer-events="none"/>`;
        }
        if (isErr) svg += `<text x="${x(s._t) + Math.max(x(s._t + s._d) - x(s._t), 3) + 6}" y="${yy + laneH - 2}"
                             style="fill:${css('--critical')};font-weight:600">✕ error</text>`;
      }
    });
  });
  svg += `</svg>`;
  $('chart').innerHTML = svg;

  // Hover tooltip and click -> details.
  const tip = $('tip');
  $('chart').querySelectorAll('.bar').forEach(el => {
    el.addEventListener('mousemove', (e) => {
      const [t1, t2] = el.dataset.tip.split('|');
      tip.innerHTML = `<b>${esc(t1)}</b><br>${esc(t2)}`; tip.style.display = 'block';
      tip.style.left = Math.min(e.clientX + 12, innerWidth - 330) + 'px'; tip.style.top = (e.clientY + 12) + 'px';
    });
    el.addEventListener('mouseleave', () => tip.style.display = 'none');
    el.addEventListener('click', () => selectStep(el.dataset.step));
  });
}

// =====================================================================
// Tables (also the accessible text view of the chart)
// =====================================================================
function stepTable(r) {
  return `<details open><summary>All steps of ${esc(r.run_id)} (table view)</summary><table>
    <tr><th>#</th><th>Agent</th><th>Role</th><th class="num">Start</th><th class="num">Duration</th><th>Status</th><th>Error</th></tr>
    ${r.steps.map(s => `<tr class="click" data-step="${s.step_id}">
      <td>${s.seq}</td><td>${esc(s.agent)}</td><td>${esc(s.role)}</td><td class="num">${fmt(s._t)}</td>
      <td class="num">${fmt(s._d)}${isSlow(s) ? ' ⚠' : ''}</td>
      <td style="color:${s.status === 'error' ? css('--critical') : css('--good')}">${s.status === 'error' ? '✕' : '✓'} ${esc(s.status)}</td>
      <td>${esc(s.error_message || '')}</td></tr>`).join('')}
  </table></details>`;
}

function compareTable() {
  const cell = (s) => s ? `${fmt(s._d)} ${s.status === 'error' ? '<span class="err">✕</span>' : '✓'}` : '<span style="color:var(--muted)">not run</span>';
  return `<details open><summary>Step by step: A vs B</summary><table>
    <tr><th>Agent</th><th class="num">A</th><th class="num">B</th><th class="num">B − A</th><th>Note</th></tr>
    ${diffRows().map(x => {
      const delta = x.a && x.b ? x.b._d - x.a._d : null;
      const note = !x.a ? 'only in B' : !x.b ? 'only in A' : x.a.status !== x.b.status ? 'status differs' :
                   Math.abs(delta) > 1000 ? (delta > 0 ? 'B slower' : 'A slower') : '';
      return `<tr class="click" data-step="${(x.a || x.b).step_id}"><td>${esc(x.agent)}</td>
        <td class="num">${cell(x.a)}</td><td class="num">${cell(x.b)}</td>
        <td class="num">${delta == null ? '–' : (delta >= 0 ? '+' : '−') + fmt(Math.abs(delta))}</td>
        <td>${note ? '<b>' + note + '</b>' : ''}</td></tr>`;
    }).join('')}
  </table></details>`;
}

// =====================================================================
// Right: detail panel
// =====================================================================
function selectStep(id) { selStep = id; renderDetail(); drawTimeline(); }

function renderDetail() {
  const s = RUNS.flatMap(r => r.steps).find(s => s.step_id === selStep);
  if (!s) { $('detail').innerHTML = '<p class="hint" style="margin:0">Click a bar in the timeline or a table row.</p>'; return; }
  const json = (v) => v == null ? '<span class="src">–</span>' : `<pre>${esc(JSON.stringify(v, null, 2))}</pre>`;
  const llm = s.llm && s.llm.model ? `<div class="k">Model</div><div>${esc(s.llm.provider)} · ${esc(s.llm.model)}</div>
                       <div class="k">Tokens</div><div>${s.llm.input_tokens ?? '–'} in / ${s.llm.output_tokens ?? '–'} out</div>` : '';
  $('detail').innerHTML = `
    <h3 style="margin:4px 0 8px">${esc(s.agent)}</h3>
    <div class="kv">
      <div class="k">Run</div><div>${esc(s.run_id)}</div>
      <div class="k">Step</div><div>${esc(s.step_id)} (#${s.seq})</div>
      <div class="k">Role</div><div>${esc(s.role)}</div>
      <div class="k">Status</div><div style="color:${s.status === 'error' ? css('--critical') : css('--good')}">${s.status === 'error' ? '✕' : '✓'} ${esc(s.status)}</div>
      <div class="k">Start</div><div>${esc(s.start_time)}</div>
      <div class="k">End</div><div>${esc(s.end_time)}</div>
      <div class="k">Duration</div><div>${fmt(s._d)}${isSlow(s) ? ` · ⚠ usual ${fmt(MEDIAN[s.agent])}` : ''}</div>
      <div class="k">Predecessor</div><div>${esc(s.predecessor || '–')}${s.branch != null ? ` (output ${s.branch === 0 ? 'true' : 'false'})` : ''}</div>
      ${llm}
    </div>
    ${s.error_message ? `<p class="err">✕ ${esc(s.error_message)}</p>` : ''}
    <h2 style="margin:14px 0 4px">Input</h2>${json(s.input)}
    <h2 style="margin:14px 0 4px">Output</h2>${json(s.output)}
    <p class="src">All values come from traces.json (step ${esc(s.step_id)}). Names and accounts are redacted in the export.</p>`;
}

window.addEventListener('resize', () => runA && drawTimeline());   // redraw on window resize
load();
</script>
